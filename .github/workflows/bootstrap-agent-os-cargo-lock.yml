name: Bootstrap Agent OS Cargo Lock

on:
  push:
    branches:
      - agent-os-v1

permissions:
  contents: write

concurrency:
  group: bootstrap-agent-os-cargo-lock
  cancel-in-progress: false

jobs:
  pin-lock:
    name: pin bootstrap installer Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Agent OS branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent-os-v1

      - name: Generate and commit lockfile once
        shell: bash
        run: |
          set -euo pipefail
          lock="apps/bootstrap-installer/src-tauri/Cargo.lock"
          manifest="apps/bootstrap-installer/src-tauri/Cargo.toml"

          if [[ -f "$lock" ]]; then
            echo "Cargo.lock already committed; nothing to do."
            exit 0
          fi

          cargo generate-lockfile --manifest-path "$manifest"
          cargo metadata --locked --manifest-path "$manifest" --format-version 1 >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$lock"
          git commit -m "build(installer): pin bootstrap Rust dependencies"
          git push origin HEAD:agent-os-v1
