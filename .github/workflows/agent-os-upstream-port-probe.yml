name: Agent OS upstream delta-port probe

on:
  push:
    branches:
      - agent-os-v1-upstream-sync
    paths:
      - ".github/workflows/agent-os-upstream-port-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch local upstream mirror
        run: git fetch origin upstream-main-2026-09-25

      - name: Probe upstream-first delta port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agent-os-upstream-probe"
          git config user.email "agent-os-upstream-probe@users.noreply.github.com"

          ours="$(git rev-parse HEAD)"
          upstream="$(git rev-parse origin/upstream-main-2026-09-25)"
          base="$(git merge-base "$ours" "$upstream")"

          mkdir -p port-evidence/failed
          printf '%s\n' "$ours" > port-evidence/ours.txt
          printf '%s\n' "$upstream" > port-evidence/upstream.txt
          printf '%s\n' "$base" > port-evidence/base.txt

          set +e
          git merge --no-commit --no-ff "$upstream"
          merge_status=$?
          set -e
          git diff --name-only --diff-filter=U > port-evidence/conflicts.txt

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git ls-files -u -- "$file" | awk '{print $3}' | grep -qx 3; then
              git checkout --theirs -- "$file"
              git add -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done < port-evidence/conflicts.txt

          : > port-evidence/ported-ok.txt
          : > port-evidence/ported-failed.txt

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            safe="$(printf '%s' "$file" | tr '/.' '__')"
            patch="port-evidence/failed/$safe.patch"
            git diff --binary "$base" "$ours" -- "$file" > "$patch" || true
            if [ ! -s "$patch" ]; then
              rm -f "$patch"
              printf '%s\n' "$file" >> port-evidence/ported-ok.txt
              continue
            fi

            set +e
            git apply --3way --index "$patch" >"port-evidence/failed/$safe.log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              rm -f "$patch" "port-evidence/failed/$safe.log"
              printf '%s\n' "$file" >> port-evidence/ported-ok.txt
            else
              git reset -- "$file" >/dev/null 2>&1 || true
              if git ls-tree -r --name-only "$upstream" -- "$file" | grep -qx "$file"; then
                git checkout "$upstream" -- "$file"
              else
                rm -f -- "$file"
              fi
              printf '%s\n' "$file" >> port-evidence/ported-failed.txt
            fi
          done < port-evidence/conflicts.txt

          printf '%s\n' "$merge_status" > port-evidence/merge-status.txt
          git diff --check --cached > port-evidence/diff-check.txt 2>&1 || true
          git diff --cached --stat > port-evidence/staged-stat.txt || true
          git status --porcelain=v1 > port-evidence/status.txt

          git merge --abort || git reset --hard "$ours"

      - name: Upload delta-port evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-os-upstream-port-${{ github.sha }}
          path: port-evidence
          include-hidden-files: true
          retention-days: 2
