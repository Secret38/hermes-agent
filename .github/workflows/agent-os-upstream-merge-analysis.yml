name: Agent OS upstream merge analysis

on:
  push:
    branches:
      - agent-os-v1-release-qualification
    paths:
      - ".github/workflows/agent-os-upstream-merge-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: agent-os-v1-release-qualification

      - name: Fetch pinned upstream snapshot
        shell: bash
        run: git fetch origin agent-os-upstream-2026-09-26

      - name: Analyze real three-way merge
        id: merge
        shell: bash
        run: |
          set +e
          git config user.name "agent-os-merge-analysis"
          git config user.email "agent-os-merge-analysis@users.noreply.github.com"
          git merge --no-commit --no-ff origin/agent-os-upstream-2026-09-26
          status=$?
          set -e

          mkdir -p "$RUNNER_TEMP/agent-os-merge-analysis"
          printf '%s\n' "$status" > "$RUNNER_TEMP/agent-os-merge-analysis/merge-exit-code.txt"
          git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/agent-os-merge-analysis/conflicts.txt"
          git status --short > "$RUNNER_TEMP/agent-os-merge-analysis/status.txt"
          git diff --cc --binary > "$RUNNER_TEMP/agent-os-merge-analysis/conflicts.patch" || true

          echo "merge_status=$status" >> "$GITHUB_OUTPUT"
          echo "conflict_count=$(wc -l < "$RUNNER_TEMP/agent-os-merge-analysis/conflicts.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        run: |
          echo "### Agent OS upstream merge analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "- merge exit: ${{ steps.merge.outputs.merge_status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- conflicts: ${{ steps.merge.outputs.conflict_count }}" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/agent-os-merge-analysis/conflicts.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merge analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-os-upstream-merge-analysis-${{ github.sha }}
          path: ${{ runner.temp }}/agent-os-merge-analysis
          retention-days: 2
