name: Agent OS upstream merge apply

on:
  push:
    branches:
      - agent-os-v1-release-qualification
    paths:
      - ".github/workflows/agent-os-upstream-merge-apply.yml"

permissions:
  contents: write

jobs:
  merge:
    if: github.repository == 'Secret38/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: agent-os-v1-release-qualification

      - name: Fetch pinned upstream snapshot
        shell: bash
        run: git fetch origin agent-os-upstream-2026-09-26

      - name: Merge upstream and resolve conflicts in favor of pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          git config user.name "$(git log -1 --format=%an HEAD)"
          git config user.email "$(git log -1 --format=%ae HEAD)"

          # This tracked catalog file currently contains CRLF bytes while the
          # repository attributes normalize text to LF. Disable that clean filter
          # for this one runner-local path and restore exact HEAD bytes so the
          # merge starts from a truly clean worktree without changing the repo.
          mkdir -p .git/info
          printf '%s\n' 'plugin-catalog/intelligent-tool-break.yaml -text' >> .git/info/attributes
          git checkout --force HEAD -- plugin-catalog/intelligent-tool-break.yaml
          test -z "$(git status --porcelain)"

          set +e
          git merge --no-commit --no-ff origin/agent-os-upstream-2026-09-26
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/conflicts.txt"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              if git cat-file -e "origin/agent-os-upstream-2026-09-26:$file" 2>/dev/null; then
                git checkout origin/agent-os-upstream-2026-09-26 -- "$file"
                git add -- "$file"
              else
                git rm -f -- "$file"
              fi
            done < "$RUNNER_TEMP/conflicts.txt"
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error::Unresolved merge conflicts remain"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          test -z "$(git ls-files -u)"

          out="$RUNNER_TEMP/agent-os-upstream-merged-tree"
          mkdir -p "$out/files"
          printf '%s\n' "$before" > "$out/parent-ours.txt"
          git rev-parse origin/agent-os-upstream-2026-09-26 > "$out/parent-upstream.txt"
          git diff --cached --name-status origin/agent-os-upstream-2026-09-26 > "$out/delta-status.txt"
          git diff --cached --name-only --diff-filter=ACMR origin/agent-os-upstream-2026-09-26 > "$out/materialized-paths.txt"
          git diff --cached --name-only --diff-filter=D origin/agent-os-upstream-2026-09-26 > "$out/deleted-paths.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "$out/files/$(dirname "$file")"
            cp -p -- "$file" "$out/files/$file"
          done < "$out/materialized-paths.txt"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            git ls-files -s -- "$file"
          done < "$out/materialized-paths.txt" > "$out/index-modes.txt"

          # Upload all non-workflow merged blobs through a temporary carrier
          # commit whose parent is the pinned upstream snapshot. Its workflow
          # directory is byte-for-byte upstream, so the Actions token does not
          # need workflow-write permission.
          git rm -r -f --ignore-unmatch .github/workflows >/dev/null
          git checkout origin/agent-os-upstream-2026-09-26 -- .github/workflows
          git add -A .github/workflows
          test -z "$(git diff --cached --name-only origin/agent-os-upstream-2026-09-26 -- .github/workflows)"
          carrier_tree="$(git write-tree)"
          carrier_commit="$(printf '%s\n' 'chore(agent-os): materialize upstream merge carrier' | git commit-tree "$carrier_tree" -p origin/agent-os-upstream-2026-09-26)"
          printf '%s\n' "$carrier_commit" > "$out/carrier-commit.txt"
          printf '%s\n' "$carrier_tree" > "$out/carrier-tree.txt"
          git push --force origin "$carrier_commit:refs/heads/agent-os-upstream-merge-carrier"


      - name: Upload merged tree artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-os-upstream-merged-tree-${{ github.sha }}
          path: ${{ runner.temp }}/agent-os-upstream-merged-tree
          retention-days: 2
