name: Agent OS upstream merge apply

on:
  push:
    branches:
      - agent-os-v1-upstream-sync
    paths:
      - ".github/workflows/agent-os-upstream-merge-apply.yml"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: agent-os-v1-upstream-sync

      - name: Merge current upstream with upstream-first conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agent-os-upstream-sync"
          git config user.email "agent-os-upstream-sync@users.noreply.github.com"
          git config core.autocrlf false
          git reset --hard HEAD
          git clean -fdx

          git fetch origin upstream-main-2026-09-25
          ours="$(git rev-parse HEAD)"
          upstream="$(git rev-parse origin/upstream-main-2026-09-25)"

          set +e
          git merge --no-commit --no-ff "$upstream"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && [ "$merge_status" -ne 1 ]; then
            echo "::error::git merge failed before conflict resolution: $merge_status"
            exit "$merge_status"
          fi

          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git ls-files -u -- "$file" | awk '{print $3}' | grep -qx 3; then
              git checkout --theirs -- "$file"
              git add -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done < /tmp/conflicts.txt

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Unresolved merge paths remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # The GitHub Actions installation token cannot push workflow-file
          # changes. Keep this subtree byte-for-byte on the merge commit;
          # workflows are synchronized separately through the GitHub connector.
          git checkout "$ours" -- .github/workflows
          git add .github/workflows

          git status --short
          git commit -m "chore(agent-os): merge current Hermes upstream"
          git push origin HEAD:agent-os-v1-upstream-sync
