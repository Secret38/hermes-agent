# .github/workflows/rust-tests.yml
name: Rust tests

# `cargo test` for the Tauri bootstrap installer (Hermes-Setup). Nothing in CI
# compiled this crate before: `.rs` lives under `apps/`, so the change
# classifier matched it as `frontend` and ran the TypeScript matrix, which
# cannot notice a Rust error. The crate's unit tests existed in the tree and had
# never run.
#
# Linux runner on purpose. The pipe-drain tests in src/powershell.rs need a real
# process tree whose grandchild inherits the parent's stdout, and their fixture
# is `#[cfg(unix)]`; the Windows half of that same contract is covered by
# `-SelfTestPipeDrain` in scripts/desktop-update/windows.ps1 on the Windows
# lane. A Windows runner here would compile them out and report green over zero
# coverage.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-installer:
    name: cargo test (bootstrap installer)
    # cargo builds codegen units and test binaries in parallel across the
    # cores. This lane also builds the crate from the start when Cargo.toml
    # changes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/bootstrap-installer/src-tauri
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Tauri links against the system webkit2gtk on Linux, so the crate does
      # not compile without these even for `cargo test --lib`.
      - name: Install Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # Until the first Cargo.lock is committed, key the cache on Cargo.toml.
      # The job uploads the resolver-generated lockfile below so the release
      # branch can commit it, then this lane is switched to Cargo.lock + --locked.
      # No restore-keys: partial Rust target caches are not trusted across
      # dependency graph changes.
      - name: Restore cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bootstrap-installer/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.toml') }}

      # --lib only: the integration/bin targets would need a built frontend
      # (vite dist) that this lane deliberately does not produce.
      - name: cargo test
        run: cargo test --lib

      - name: Capture resolved Cargo lockfile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v4.6.2
        with:
          name: bootstrap-installer-cargo-lock
          path: apps/bootstrap-installer/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1


  windows-package:
    name: build Windows Hermes-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      HERMES_BUILD_PIN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      HERMES_BUILD_PIN_BRANCH: ${{ github.head_ref || github.ref_name }}
      HERMES_BUILD_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install bootstrap frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --workspace @hermes/bootstrap-installer

      - name: Verify Rust dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'apps/bootstrap-installer/src-tauri/Cargo.toml'
          $lock = 'apps/bootstrap-installer/src-tauri/Cargo.lock'
          if (-not (Test-Path $lock)) {
            throw "Missing committed Cargo.lock for bootstrap installer"
          }
          cargo metadata --locked --manifest-path $manifest --format-version 1 | Out-Null

      - name: Build pinned Windows bootstrap executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri:build --workspace @hermes/bootstrap-installer -- --no-bundle

          $exe = 'apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Expected bootstrap executable was not produced: $exe"
          }

          git diff --exit-code -- apps/bootstrap-installer/src-tauri/Cargo.lock
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination dist/Hermes-Setup.exe -Force

          $hash = (Get-FileHash -Algorithm SHA256 dist/Hermes-Setup.exe).Hash.ToLowerInvariant()
          "$hash  Hermes-Setup.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

          [ordered]@{
            repository = $env:HERMES_BUILD_REPOSITORY
            commit = $env:HERMES_BUILD_PIN_COMMIT
            branch = $env:HERMES_BUILD_PIN_BRANCH
            sha256 = $hash
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/build-metadata.json

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v4.6.2
        with:
          name: Hermes-Setup-windows-x64
          path: |
            dist/Hermes-Setup.exe
            dist/SHA256SUMS.txt
            dist/build-metadata.json
          if-no-files-found: error
          retention-days: 7
