name: Agent OS Release

on:
  push:
    tags:
      - "agent-os-v*"

permissions:
  contents: write

concurrency:
  group: agent-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: qualify, sign, and publish Windows release
    # Cua Driver requires an attached interactive Windows desktop. GitHub-hosted
    # Windows runs as a service and cannot prove GT-12/13. Production release
    # therefore requires a trusted runner that is logged into Session 1+.
    runs-on: [self-hosted, windows, x64, agent-os-gui]
    timeout-minutes: 75
    env:
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
      HERMES_BUILD_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify release tag is current Agent OS branch head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          git fetch origin agent-os-v1 --depth=1
          $branchHead = (git rev-parse origin/agent-os-v1).Trim()
          if ($commit -ne $branchHead) {
            throw "Release tag must point at current agent-os-v1 HEAD. tag=$commit branch=$branchHead"
          }
          "HERMES_BUILD_PIN_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HERMES_BUILD_PIN_BRANCH=agent-os-v1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install release qualification dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Provision complete Agent OS runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          uv run --no-sync hermes agent-os provision
          if ($LASTEXITCODE -ne 0) { throw "Agent OS provisioning failed" }

      - name: Require real desktop readiness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $health = uv run --no-sync hermes agent-os status --require-full --json
          if ($LASTEXITCODE -ne 0) {
            throw "Agent OS full-readiness gate failed. The release runner must have an interactive Windows desktop."
          }
          $health | Set-Content -Encoding utf8 dist/agent-os-health.json

      - name: Prove native Windows GT-12 and GT-13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-sync python -m pytest tests/agent_os/test_windows_golden_e2e.py -m "windows_only and integration" -v --tb=short
          if ($LASTEXITCODE -ne 0) { throw "Native Windows Golden E2E failed" }

      - name: Prove canonical Agent OS V1 20/20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $golden = uv run --no-sync python scripts/agent_os_golden.py --json
          if ($LASTEXITCODE -ne 0) { throw "Agent OS 20/20 Golden Task gate failed" }
          $golden | Set-Content -Encoding utf8 dist/agent-os-golden-results.json

      - name: Set up Node.js 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install bootstrap frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --workspace @hermes/bootstrap-installer

      - name: Verify locked Rust dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'apps/bootstrap-installer/src-tauri/Cargo.toml'
          $lock = 'apps/bootstrap-installer/src-tauri/Cargo.lock'
          if (-not (Test-Path $lock -PathType Leaf)) {
            throw "Missing committed Cargo.lock for bootstrap installer"
          }
          cargo metadata --locked --manifest-path $manifest --format-version 1 | Out-Null

      - name: Build pinned Hermes-Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri:build --workspace @hermes/bootstrap-installer -- --no-bundle
          git diff --exit-code -- apps/bootstrap-installer/src-tauri/Cargo.lock

          $exe = 'apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Expected bootstrap executable was not produced: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination dist/Hermes-Setup.exe -Force

      - name: Authenticode-sign Hermes-Setup.exe
        shell: pwsh
        env:
          WINDOWS_CODE_SIGN_PFX_B64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_B64 }}
          WINDOWS_CODE_SIGN_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGN_PFX_B64)) {
            throw "Missing WINDOWS_CODE_SIGN_PFX_B64 repository secret; refusing an unsigned production release"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGN_PASSWORD)) {
            throw "Missing WINDOWS_CODE_SIGN_PASSWORD repository secret"
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'agent-os-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGN_PFX_B64))

          try {
            $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $signtool = Get-ChildItem -Path $kits -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found on the runner" }

            & $signtool.FullName sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /f $pfx /p $env:WINDOWS_CODE_SIGN_PASSWORD dist/Hermes-Setup.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

          $signature = Get-AuthenticodeSignature dist/Hermes-Setup.exe
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }

      - name: Finalize release evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -Algorithm SHA256 dist/Hermes-Setup.exe).Hash.ToLowerInvariant()
          "$hash  Hermes-Setup.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

          $signature = Get-AuthenticodeSignature dist/Hermes-Setup.exe
          [ordered]@{
            repository = $env:HERMES_BUILD_REPOSITORY
            commit = $env:HERMES_BUILD_PIN_COMMIT
            branch = $env:HERMES_BUILD_PIN_BRANCH
            tag = $env:GITHUB_REF_NAME
            sha256 = $hash
            signature_status = [string]$signature.Status
            signer = [string]$signature.SignerCertificate.Subject
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/build-metadata.json

      - name: Upload signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: Hermes-Setup-signed-${{ github.ref_name }}
          path: |
            dist/Hermes-Setup.exe
            dist/SHA256SUMS.txt
            dist/build-metadata.json
            dist/agent-os-health.json
            dist/agent-os-golden-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:GITHUB_REF_NAME dist/Hermes-Setup.exe dist/SHA256SUMS.txt dist/build-metadata.json dist/agent-os-health.json dist/agent-os-golden-results.json --verify-tag --title "Agent OS $env:GITHUB_REF_NAME" --generate-notes
